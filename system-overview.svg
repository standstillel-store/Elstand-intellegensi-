<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="violetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b76"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e8a33d" font-size="17" letter-spacing="2" font-weight="700" filter="url(#goldGlow)">ELSTAND INTELLIGENCE — SYSTEM OVERVIEW</text>
  <line x1="300" y1="52" x2="600" y2="52" stroke="#e8a33d" stroke-width="1" opacity="0.4"/>

  <!-- Data source row -->
  <g font-size="12" fill="#c9c9d2">
    <rect x="70" y="80" width="200" height="52" rx="6" fill="#1a1a20" stroke="#3a3a44"/>
    <text x="170" y="102" text-anchor="middle" fill="#8f8fa3" font-size="10" letter-spacing="1">MACRO DATA</text>
    <text x="170" y="120" text-anchor="middle" fill="#d8d8e0" font-size="10.5">FRED · Fear&amp;Greed · Calendar</text>

    <rect x="350" y="80" width="200" height="52" rx="6" fill="#1a1a20" stroke="#3a3a44"/>
    <text x="450" y="102" text-anchor="middle" fill="#8f8fa3" font-size="10" letter-spacing="1">MARKET DATA</text>
    <text x="450" y="120" text-anchor="middle" fill="#d8d8e0" font-size="10.5">CoinGecko · Binance · GeckoTerminal</text>

    <rect x="630" y="80" width="200" height="52" rx="6" fill="#1a1a20" stroke="#3a3a44"/>
    <text x="730" y="102" text-anchor="middle" fill="#8f8fa3" font-size="10" letter-spacing="1">EXTERNAL DATA</text>
    <text x="730" y="120" text-anchor="middle" fill="#d8d8e0" font-size="10.5">NewsAPI · Alchemy · DefiLlama</text>
  </g>

  <!-- Converge lines -->
  <path d="M170,132 L170,160 L450,160" stroke="#4a4a56" stroke-width="1.2" fill="none"/>
  <path d="M730,132 L730,160 L450,160" stroke="#4a4a56" stroke-width="1.2" fill="none"/>
  <line x1="450" y1="132" x2="450" y2="160" stroke="#4a4a56" stroke-width="1.2"/>
  <line x1="450" y1="160" x2="450" y2="190" stroke="#4a4a56" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Evidence -->
  <rect x="350" y="192" width="200" height="46" rx="6" fill="#17171c" stroke="#e8a33d" stroke-opacity="0.55"/>
  <text x="450" y="220" text-anchor="middle" fill="#e8a33d" font-size="12.5" letter-spacing="2">EVIDENCE</text>

  <line x1="450" y1="238" x2="450" y2="268" stroke="#4a4a56" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ELVOID core -->
  <rect x="330" y="270" width="240" height="66" rx="8" fill="#1c1420" stroke="#a06bf0" stroke-width="1.4" filter="url(#violetGlow)"/>
  <text x="450" y="298" text-anchor="middle" fill="#c9a3f7" font-size="15" letter-spacing="3" font-weight="700">ELVOID</text>
  <text x="450" y="318" text-anchor="middle" fill="#9d84b8" font-size="10">decision-intelligence layer</text>

  <line x1="450" y1="336" x2="450" y2="366" stroke="#4a4a56" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Decision Intelligence -->
  <rect x="320" y="368" width="260" height="46" rx="6" fill="#17171c" stroke="#5a5a66"/>
  <text x="450" y="396" text-anchor="middle" fill="#e3e3ea" font-size="12" letter-spacing="1.5">DECISION INTELLIGENCE</text>

  <line x1="450" y1="414" x2="450" y2="444" stroke="#4a4a56" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Outcome -->
  <rect x="350" y="446" width="200" height="42" rx="6" fill="#141418" stroke="#3a3a44"/>
  <text x="450" y="472" text-anchor="middle" fill="#c9c9d2" font-size="11.5" letter-spacing="1.5">OUTCOME</text>

  <line x1="450" y1="488" x2="450" y2="516" stroke="#4a4a56" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Evaluation -->
  <rect x="350" y="518" width="200" height="40" rx="6" fill="#141418" stroke="#3a3a44"/>
  <text x="450" y="542" text-anchor="middle" fill="#8fb3a3" font-size="11.5" letter-spacing="1.5">EVALUATION</text>

  <!-- Learning loop back to Evidence -->
  <path d="M550,538 C 760,538 760,205 552,215" stroke="#3fae7a" stroke-width="1.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="705" y="380" fill="#3fae7a" font-size="10.5" letter-spacing="1" transform="rotate(90 705 380)">LEARNING SIGNAL (feedback)</text>

  <text x="450" y="600" text-anchor="middle" fill="#5a5a66" font-size="10">Data → Evidence → ELVOID → Decision → Outcome → Evaluation → back into Evidence</text>
</svg>
