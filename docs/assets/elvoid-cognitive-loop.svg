<svg viewBox="0 0 620 620" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141019"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a70b8"/>
    </marker>
  </defs>
  <rect width="620" height="620" fill="url(#bg3)"/>
  <text x="310" y="38" text-anchor="middle" fill="#c9a3f7" font-size="15" letter-spacing="2" font-weight="700">ELVOID COGNITIVE LOOP</text>
  <text x="310" y="58" text-anchor="middle" fill="#77778a" font-size="9.5" letter-spacing="1">Phase 8.1+ — capture implemented today; scoring/learning stages are roadmap</text>

  <!-- circular arrangement of 6 nodes -->
  <!-- centers roughly on a circle radius 220 around (310,340) -->
  <g font-size="11.5">
    <!-- Decision: top -->
    <rect x="230" y="110" width="160" height="52" rx="7" fill="#17171c" stroke="#4a4a56"/>
    <text x="310" y="141" text-anchor="middle" fill="#d8d8e0" letter-spacing="1">DECISION</text>

    <!-- Outcome: upper right -->
    <rect x="420" y="220" width="160" height="52" rx="7" fill="#17171c" stroke="#4a4a56"/>
    <text x="500" y="251" text-anchor="middle" fill="#d8d8e0" letter-spacing="1">OUTCOME</text>

    <!-- Evaluation: lower right -->
    <rect x="420" y="400" width="160" height="52" rx="7" fill="#17171c" stroke="#3fae7a" stroke-opacity="0.6"/>
    <text x="500" y="431" text-anchor="middle" fill="#8fcbaa" letter-spacing="1">EVALUATION</text>
    <text x="500" y="446" text-anchor="middle" fill="#5a5a66" font-size="8.5">ROADMAP</text>

    <!-- Error Analysis: bottom -->
    <rect x="230" y="500" width="160" height="52" rx="7" fill="#17171c" stroke="#3fae7a" stroke-opacity="0.6"/>
    <text x="310" y="527" text-anchor="middle" fill="#8fcbaa" letter-spacing="1">ERROR ANALYSIS</text>
    <text x="310" y="542" text-anchor="middle" fill="#5a5a66" font-size="8.5">ROADMAP</text>

    <!-- Learning: lower left -->
    <rect x="40" y="400" width="160" height="52" rx="7" fill="#1c1420" stroke="#a06bf0" stroke-width="1.2"/>
    <text x="120" y="431" text-anchor="middle" fill="#c9a3f7" letter-spacing="1">LEARNING</text>
    <text x="120" y="446" text-anchor="middle" fill="#5a5a66" font-size="8.5">ROADMAP</text>

    <!-- Future Reasoning: upper left -->
    <rect x="40" y="220" width="160" height="52" rx="7" fill="#17171c" stroke="#4a4a56"/>
    <text x="120" y="245" text-anchor="middle" fill="#d8d8e0" letter-spacing="1">FUTURE</text>
    <text x="120" y="260" text-anchor="middle" fill="#d8d8e0" letter-spacing="1">REASONING</text>
  </g>

  <!-- connecting arrows around the hexagon -->
  <path d="M390,145 C 430,165 445,190 448,218" stroke="#6b6b76" stroke-width="1.3" fill="none" marker-end="url(#arrow3)"/>
  <path d="M500,272 L500,398" stroke="#6b6b76" stroke-width="1.3" fill="none" marker-end="url(#arrow3)"/>
  <path d="M448,442 C 400,480 350,500 322,500" stroke="#6b6b76" stroke-width="1.3" fill="none" marker-end="url(#arrow3)"/>
  <path d="M230,530 C 180,510 155,485 148,452" stroke="#6b6b76" stroke-width="1.3" fill="none" marker-end="url(#arrow3)"/>
  <path d="M120,398 L120,274" stroke="#6b6b76" stroke-width="1.3" fill="none" marker-end="url(#arrow3)"/>
  <path d="M172,220 C 200,190 215,165 232,146" stroke="#6b6b76" stroke-width="1.3" fill="none" marker-end="url(#arrow3)"/>

  <!-- center label -->
  <circle cx="310" cy="336" r="46" fill="#0e0e12" stroke="#3a3a44"/>
  <text x="310" y="332" text-anchor="middle" fill="#e8a33d" font-size="10" letter-spacing="1">DECISION</text>
  <text x="310" y="346" text-anchor="middle" fill="#e8a33d" font-size="10" letter-spacing="1">EXPERIENCES</text>
  <text x="310" y="360" text-anchor="middle" fill="#5a5a66" font-size="8">Learning DB (8.1.0)</text>
</svg>
