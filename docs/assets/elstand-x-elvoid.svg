<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b76"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="url(#bg4)"/>
  <text x="450" y="36" text-anchor="middle" fill="#e8a33d" font-size="16" letter-spacing="2" font-weight="700">ELSTAND × ELVOID</text>

  <!-- Outer ecosystem boundary -->
  <rect x="40" y="60" width="820" height="380" rx="14" fill="none" stroke="#e8a33d" stroke-opacity="0.35" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="60" y="86" fill="#e8a33d" font-size="11" letter-spacing="2">ELSTAND INTELLIGENCE — ECOSYSTEM / PLATFORM</text>

  <!-- component boxes -->
  <g font-size="11.5" fill="#d8d8e0">
    <rect x="70" y="110" width="190" height="54" rx="6" fill="#17171c" stroke="#3a3a44"/>
    <text x="165" y="142" text-anchor="middle" letter-spacing="0.5">Macro Intelligence</text>

    <rect x="70" y="182" width="190" height="54" rx="6" fill="#17171c" stroke="#3a3a44"/>
    <text x="165" y="214" text-anchor="middle" letter-spacing="0.5">Quant / Market Intelligence</text>

    <rect x="70" y="254" width="190" height="54" rx="6" fill="#17171c" stroke="#3a3a44"/>
    <text x="165" y="286" text-anchor="middle" letter-spacing="0.5">Order Flow</text>

    <rect x="70" y="326" width="190" height="54" rx="6" fill="#17171c" stroke="#3a3a44"/>
    <text x="165" y="358" text-anchor="middle" letter-spacing="0.5">Web3 Intelligence</text>

    <rect x="290" y="146" width="190" height="54" rx="6" fill="#17171c" stroke="#3a3a44"/>
    <text x="385" y="178" text-anchor="middle" letter-spacing="0.5">External Intelligence</text>

    <rect x="290" y="290" width="190" height="54" rx="6" fill="#17171c" stroke="#3a3a44"/>
    <text x="385" y="322" text-anchor="middle" letter-spacing="0.5">Intelligence Map</text>
  </g>

  <!-- ELVOID box, right side -->
  <rect x="560" y="150" width="260" height="180" rx="10" fill="#1c1420" stroke="#a06bf0" stroke-width="1.6"/>
  <text x="690" y="200" text-anchor="middle" fill="#c9a3f7" font-size="20" letter-spacing="3" font-weight="700">ELVOID</text>
  <text x="690" y="222" text-anchor="middle" fill="#9d84b8" font-size="10.5">decision-intelligence layer</text>
  <line x1="600" y1="240" x2="780" y2="240" stroke="#5a4670"/>
  <text x="690" y="262" text-anchor="middle" fill="#b9a0d8" font-size="9.5">Oracle · Confluence · Risk</text>
  <text x="690" y="280" text-anchor="middle" fill="#b9a0d8" font-size="9.5">Scenario · Arbitration</text>
  <text x="690" y="298" text-anchor="middle" fill="#b9a0d8" font-size="9.5">Cognitive Layer (8.0.x)</text>

  <!-- arrows from components to ELVOID -->
  <path d="M260,137 C 420,130 480,150 558,190" stroke="#6b6b76" stroke-width="1.1" fill="none" marker-end="url(#arrow4)"/>
  <path d="M260,209 C 400,205 460,210 558,220" stroke="#6b6b76" stroke-width="1.1" fill="none" marker-end="url(#arrow4)"/>
  <path d="M260,281 C 400,270 460,255 558,240" stroke="#6b6b76" stroke-width="1.1" fill="none" marker-end="url(#arrow4)"/>
  <path d="M260,353 C 420,340 480,320 558,280" stroke="#6b6b76" stroke-width="1.1" fill="none" marker-end="url(#arrow4)"/>
  <path d="M480,173 C 520,180 540,190 558,205" stroke="#6b6b76" stroke-width="1.1" fill="none" marker-end="url(#arrow4)"/>
  <path d="M480,317 C 520,310 540,300 558,290" stroke="#6b6b76" stroke-width="1.1" fill="none" marker-end="url(#arrow4)"/>

  <!-- Decision Intelligence output -->
  <line x1="690" y1="330" x2="690" y2="380" stroke="#6b6b76" stroke-width="1.3" marker-end="url(#arrow4)"/>
  <rect x="560" y="382" width="260" height="42" rx="6" fill="#17171c" stroke="#e8a33d" stroke-opacity="0.6"/>
  <text x="690" y="408" text-anchor="middle" fill="#e8a33d" font-size="11.5" letter-spacing="1.5">DECISION INTELLIGENCE</text>
</svg>
