<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b76"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="url(#bg2)"/>
  <text x="450" y="34" text-anchor="middle" fill="#e8a33d" font-size="15" letter-spacing="2" font-weight="700">THE INTELLIGENCE LOOP</text>

  <!-- 5 stage boxes -->
  <g font-size="12">
    <!-- Data -->
    <rect x="20" y="90" width="140" height="60" rx="7" fill="#17171c" stroke="#4a4a56"/>
    <text x="90" y="115" text-anchor="middle" fill="#d8d8e0" font-size="12" letter-spacing="1">DATA</text>
    <text x="90" y="133" text-anchor="middle" fill="#77778a" font-size="9">raw feeds</text>

    <!-- Evidence -->
    <rect x="185" y="90" width="140" height="60" rx="7" fill="#17171c" stroke="#e8a33d" stroke-opacity="0.6"/>
    <text x="255" y="115" text-anchor="middle" fill="#e8a33d" font-size="12" letter-spacing="1">EVIDENCE</text>
    <text x="255" y="133" text-anchor="middle" fill="#8f8fa3" font-size="9">normalized, sourced</text>

    <!-- Intelligence -->
    <rect x="350" y="90" width="140" height="60" rx="7" fill="#17171c" stroke="#4a4a56"/>
    <text x="420" y="115" text-anchor="middle" fill="#d8d8e0" font-size="12" letter-spacing="1">INTELLIGENCE</text>
    <text x="420" y="133" text-anchor="middle" fill="#77778a" font-size="9">context, confluence</text>

    <!-- Reasoning -->
    <rect x="515" y="90" width="140" height="60" rx="7" fill="#1c1420" stroke="#a06bf0" stroke-width="1.3"/>
    <text x="585" y="115" text-anchor="middle" fill="#c9a3f7" font-size="12" letter-spacing="1">REASONING</text>
    <text x="585" y="133" text-anchor="middle" fill="#9d84b8" font-size="9">ELVOID</text>

    <!-- Decision -->
    <rect x="680" y="90" width="200" height="60" rx="7" fill="#17171c" stroke="#4a4a56"/>
    <text x="780" y="115" text-anchor="middle" fill="#d8d8e0" font-size="12" letter-spacing="1">DECISION</text>
    <text x="780" y="133" text-anchor="middle" fill="#77778a" font-size="9">grade · confidence · risk plan</text>
  </g>

  <line x1="160" y1="120" x2="183" y2="120" stroke="#6b6b76" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="325" y1="120" x2="348" y2="120" stroke="#6b6b76" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="490" y1="120" x2="513" y2="120" stroke="#6b6b76" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="655" y1="120" x2="678" y2="120" stroke="#6b6b76" stroke-width="1.3" marker-end="url(#arrow2)"/>

  <text x="450" y="200" text-anchor="middle" fill="#5a5a66" font-size="10">Each stage is a plain, inspectable function — no step is a black box.</text>
</svg>
